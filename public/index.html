<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>专业裁判打分板</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h3 { color: #d9534f; margin: 5px 0; }
        h4 { color: #555; margin-bottom: 20px; }
        input, button { font-size: 1.2rem; padding: 12px; margin: 10px 0; width: 90%; border-radius: 8px; border: 1px solid #ccc; text-align: center;}
        button { background-color: #007BFF; color: white; border: none; font-weight: bold; cursor: pointer; }
        #message { color: green; font-weight: bold; margin-top: 10px; }
        .pin-display { font-size: 4rem; color: #8b5cf6; font-weight: bold; letter-spacing: 5px; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="container">
        
        <div id="waitingScreen">
            <h2 style="color: #64748b;">裁判连线系统</h2>
            <p>请将此号码告知总指挥：</p>
            <div class="pin-display" id="myPin">----</div>
            <p style="color: #f59e0b; font-weight: bold;">⏳ 正在等待后台派发任务...</p>
        </div>

        <div id="scoringScreen" style="display: none;">
            <div style="background:#e2e8f0; padding:10px; border-radius:8px; margin-bottom:15px;">
                <span style="font-weight:bold; color:#334155;">当前任务：</span>
                <strong id="assignedInfo" style="color:#007BFF; font-size:1.2rem;">--</strong>
            </div>

            <h4 id="eventName">等待项目...</h4>
            <h3 id="athleteName" style="font-size:1.5rem;">等待检录...</h3>
            
            <form id="scoreForm">
                <input type="number" id="score" step="0.01" placeholder="输入分数 (例: 8.5 或 +0.1)" required>
                <button type="submit">送出分数</button>
            </form>
            <p id="message"></p>
        </div>

    </div>

    <script>
        // 初始化专属 PIN 码
        let pin = localStorage.getItem('judgePin');
        if (!pin) {
            pin = Math.floor(1000 + Math.random() * 9000).toString();
            localStorage.setItem('judgePin', pin);
        }
        document.getElementById('myPin').innerText = pin;

        // 持续轮询后台获取派发状态
        setInterval(async () => {
            const res = await fetch('/api/judge-ping', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin })
            });
            const data = await res.json();
            
            if (data.assignment && data.assignment.court && data.assignment.role) {
                // 已被派发
                document.getElementById('waitingScreen').style.display = 'none';
                document.getElementById('scoringScreen').style.display = 'block';
                document.getElementById('assignedInfo').innerText = `${data.assignment.court} - ${data.assignment.role}`;
                document.getElementById('eventName').innerText = data.currentMatch.event;
                document.getElementById('athleteName').innerText = data.currentMatch.athlete;
            } else {
                // 被解除派发
                document.getElementById('waitingScreen').style.display = 'block';
                document.getElementById('scoringScreen').style.display = 'none';
            }
        }, 1500);

        // 提交分数只传 PIN 码，由后台认证
        document.getElementById('scoreForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const score = document.getElementById('score').value;

            const res = await fetch('/api/submit-score', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pin, score })
            });
            const result = await res.json();
            
            const msgEl = document.getElementById('message');
            msgEl.style.color = result.success ? "green" : "red";
            msgEl.innerText = result.message;
            document.getElementById('score').value = ''; 
            setTimeout(() => { msgEl.innerText = ''; }, 3000);
        });
    </script>
</body>
</html>
